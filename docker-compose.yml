services:
  store-shell:
    build:
      context: ./apps/store-shell
    ports:
      - "4200:4200"
    volumes:
      - ./apps/store-shell:/app
      - angular_node_modules:/app/node_modules
    command: npm run start -- --host 0.0.0.0 --port 4200
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - ecommerce-network

  product-details:
    build:
      context: ./apps/product-details
    ports:
      - "5174:5174"
    volumes:
      - ./apps/product-details:/app
      - react_node_modules:/app/node_modules
    command: npm run dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - ecommerce-network

volumes:
  angular_node_modules:
  react_node_modules:

networks:
  ecommerce-network:
    external: true